<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f6260"><meta name="description" content="Controle de regência, instrumentos, ministérios e hinos — CONTAGEM CCB."><title>CONTAGEM CCB</title><link rel="stylesheet" href="style.css?v=6-mobile"></head>
<body>
<div class="page-top" aria-hidden="true"></div>
<main class="app">
<header class="brand" aria-label="Congregação Cristã no Brasil"><img class="clef" src="assets/clave-unica.png" alt=""><img class="brand-logo" src="assets/logo-ccb.png" alt="Congregação Cristã no Brasil"><img class="clef" src="assets/clave-unica.png" alt=""></header>
<h1>CONTAGEM CCB</h1>
<div class="actions header-actions"><button type="button" id="novoEvento" class="pill primary">Novo Evento</button><button type="button" id="limpar" class="pill outline">Limpar</button></div>
<section class="group toned" aria-labelledby="head-iniciais"><h2 id="head-iniciais">Dados Iniciais</h2><div class="fields initial-fields">
<label>Santo Serviço<input id="servico" autocomplete="off"></label>
<label>Atendimento<input id="atendimento" autocomplete="off"></label>
<label>Palavra (Livro)<input id="livro" autocomplete="off"></label>
<div class="two compact"><label>Capítulo<input id="capitulo" inputmode="numeric"></label><label>Versículo<input id="versiculo" inputmode="numeric"></label></div>
<label class="wide-centered">Localidade<input id="localidade" autocomplete="off"></label>
<label class="date-centered">Data<input id="data" type="date" lang="pt-BR"></label>
</div></section>
<section class="group" aria-labelledby="head-regencia"><h2 id="head-regencia">Regência</h2><form id="regenciaForm" class="fields" autocomplete="off">
<div class="two reg-two"><label>Irmão<input name="irmao" required></label><label>Localidade<input name="localidade" required></label></div>
<label>Cargo<input name="cargo" required></label><button class="pill primary form-button" type="submit">Adicionar</button></form><div id="regenciaList" class="entries" aria-live="polite"></div></section>
<section class="group toned" aria-labelledby="head-instrumentos"><h2 id="head-instrumentos">Instrumentos</h2><form id="instrumentosForm" class="fields" autocomplete="off"><label>Instrumento<input name="nome" required></label><label class="quantity">Qtd.<input name="qtd" type="number" inputmode="numeric" min="1" step="1" required></label><button class="pill primary form-button" type="submit">Add.</button></form><div id="instrumentosList" class="entries" aria-live="polite"></div></section>
<section class="group" aria-labelledby="head-cargos"><h2 id="head-cargos">Ministério / Cargos</h2><form id="cargosForm" class="fields" autocomplete="off"><label>Cargo / Ministério<input name="nome" required></label><label class="quantity">Qtd.<input name="qtd" type="number" inputmode="numeric" min="1" step="1" required></label><button class="pill primary form-button" type="submit">Add.</button></form><div id="cargosList" class="entries" aria-live="polite"></div></section>
<section class="group toned" aria-labelledby="head-hinos"><h2 id="head-hinos">Hinos Ensaiados</h2><form id="hinosForm" class="fields" autocomplete="off"><label class="hymn">Hino Ensaiado<input name="nome" required></label><button class="pill primary form-button" type="submit">Add.</button></form><div id="hinosList" class="entries" aria-live="polite"></div></section>
<section class="totals" aria-labelledby="head-totais"><h2 id="head-totais">Total Geral</h2><div id="totalList" class="total-list"></div><div class="total-summary">
<p class="grand musicians"><span>Total de Músicos</span><strong id="somaInstrumentos">0</strong></p>
<p class="grand ministries"><span>Cargos / Ministérios</span><strong id="somaPessoas">0</strong></p>
<p class="grand hymns"><span>Hinos Ensaiados</span><strong id="somaHinos">0</strong></p>
</div></section>
<footer><div class="actions footer-actions"><button type="button" id="pdf" class="pill primary">PDF</button><button type="button" id="whatsapp" class="pill primary">Gerar Msg Whatsapp</button><button type="button" id="word" class="pill primary">Gerar Word</button><button type="button" id="limparCampos" class="pill outline">Limpar Campos</button></div><p id="feedback" role="status" aria-live="polite"></p></footer>
</main><script src="pdf-export.js"></script><script src="docx-export.js"></script><script src="app.js"></script></body></html>
