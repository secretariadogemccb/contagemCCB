<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#78797c"><title>CONTAGEM CCB</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="brand"><img class="clef" src="assets/clave.png" alt="Clave de sol"><img class="brand-logo" src="assets/logo-ccb.png" alt="Congregação Cristã no Brasil"><img class="clef" src="assets/clave.png" alt="Clave de sol"></header><h1>CONTAGEM CCB</h1><div class="actions top"><button id="novoEvento" class="pill fill">Novo Evento</button><button id="limpar" class="pill outline">Limpar</button></div>
<section class="group"><h2>Dados Iniciais</h2><div class="fields"><label class="full">Santo Serviço<input id="servico" autocomplete="off"></label><label class="full">Atendimento<input id="atendimento"></label><div class="triple"><label>Palavra (Livro)<input id="livro"></label><label>Capítulo<input id="capitulo"></label><label>Versículo<input id="versiculo"></label></div><div class="double"><label>Localidade<input id="localidade"></label><label>Data<input id="data" type="date"></label></div></div></section>
<section class="group"><h2>Regência</h2><form id="regenciaForm" class="fields"><div class="double"><label>Irmão<input name="irmao" required></label><label>Localidade<input name="localidade" required></label></div><div class="inline-form reg"><label>Cargo<input name="cargo" required></label><button class="pill fill" type="submit">Adicionar</button></div></form><div id="regenciaList" class="entries"></div></section>
<section class="group"><h2>Instrumentos</h2><form id="instrumentosForm" class="inline-form"><label>Instrumento<input name="nome" required></label><label class="qty">Qtd.<input name="qtd" type="number" min="1" step="1" required></label><button class="pill fill" type="submit">Add.</button></form><div id="instrumentosList" class="entries"></div></section>
<section class="group"><h2>Ministério / Cargos</h2><form id="cargosForm" class="inline-form"><label>Cargo / Ministério<input name="nome" required></label><label class="qty">Qtd.<input name="qtd" type="number" min="1" step="1" required></label><button class="pill fill" type="submit">Add.</button></form><div id="cargosList" class="entries"></div></section>
<section class="group"><h2>Hinos Ensaiados</h2><form id="hinosForm" class="inline-form"><label>Hino Ensaiado<input name="nome" required></label><button class="pill fill" type="submit">Add.</button></form><div id="hinosList" class="entries"></div></section>
<section class="totals"><h2>Total Geral</h2><div id="totalList"></div><p class="grand">Total Cargos / Ministérios: <strong id="somaPessoas">0</strong></p><p class="grand">Total de Músicos: <strong id="somaInstrumentos">0</strong></p><p class="grand">Hinos Ensaiados: <strong id="somaHinos">0</strong></p></section><footer><div class="actions"><button id="pdf" class="pill fill">📄 Gerar / Compartilhar PDF</button><button id="whatsapp" class="pill fill">💬 Mensagem WhatsApp</button><button id="word" class="pill fill">📝 Gerar Word</button><button id="limparCampos" class="pill outline">Limpar Campos</button></div></footer><p id="feedback" role="status" aria-live="polite"></p></main><script src="pdf-export.js"></script><script src="docx-export.js"></script><script src="app.js"></script></body></html>
